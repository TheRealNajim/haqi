# Render Blueprint for the haqi backend.
# One-click: New Blueprint Instance -> point at this repo (or "Deploy to Render").
# Render builds on its own servers, so ordinary manylinux wheels install fine.
services:
  - type: web
    name: haqi-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Keys go in the Render dashboard (Secret Files/Environment), NEVER in git.
    # sync:false = Render asks for each value when the blueprint applies.
    envVars:
      - key: HAQI_CORS_ORIGINS
        value: ""   # set to the deployed frontend origin, e.g. https://<ui>.vercel.app
      - key: OPENAQ_API_KEY
        sync: false
      - key: WAQI_TOKEN
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: NASA_FIRMS_MAP_KEY
        sync: false
      - key: BRIGHTDATA_API_KEY
        sync: false
      - key: BRIGHTDATA_SERP_ZONE
        value: serp_api1
      - key: HAQI_LOCATION_NAME
        value: Lagos
      # Nemotron parse route — NVIDIA hosted (build.nvidia.com); MODEL_API_KEY
      # value is account-secret, entered in the dashboard or via Render API.
      - key: MODEL_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: MODEL_API_KEY
        sync: false
      - key: NEMOTRON_MODEL
        value: nvidia/nemotron-3.5-bolt-e4b
      # --- Sponsor slots (values held in Render only, never in the blueprint) ---
      # TEAM decision (26 Oct night): HYBRID LIVE demo — RENDER keeps the
      # Zetaris slot armed (it reads an env-state true/false on /sources/status
      # with a short liveness probe) and Meterless joins when Nightshift's
      # weights are ready. Between demos the tunnel may be down; status then
      # shows reachable:false, an honest gap, never an error page.
      #
      # - key: ZETARIS_REST_URL
      #   sync: false
      # - key: ZETARIS_ORG_ID
      #   sync: false
      # - key: ZETARIS_API_KEY
      #   sync: false
      # - key: METERLESS_BASE_URL
      #   sync: false
      # - key: METERLESS_API_KEY
      #   sync: false
      # - key: METERLESS_MODEL
      #   sync: false
